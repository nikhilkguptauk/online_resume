name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          npx wrangler deploy --name "${{ secrets.CLOUDFLARE_WORKER_NAME }}" --compatibility-date 2024-12-01

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.RESEND_API_KEY }}" ]; then
            echo "Missing RESEND_API_KEY in GitHub Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.CONTACT_TO_EMAIL }}" ]; then
            echo "Missing CONTACT_TO_EMAIL in GitHub Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.TURNSTILE_SECRET_KEY }}" ]; then
            echo "Missing TURNSTILE_SECRET_KEY in GitHub Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.VITE_TURNSTILE_SITE_KEY }}" ]; then
            echo "Missing VITE_TURNSTILE_SITE_KEY in GitHub Secrets."
            exit 1
          fi

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          cat > .wrangler-secrets.json <<EOF
          {
            "RESEND_API_KEY": "${RESEND_API_KEY}",
            "CONTACT_TO_EMAIL": "${CONTACT_TO_EMAIL}",
            "TURNSTILE_SECRET_KEY": "${TURNSTILE_SECRET_KEY}"
          }
          EOF
          npx wrangler secret bulk .wrangler-secrets.json --name "${{ secrets.CLOUDFLARE_WORKER_NAME }}"
          rm .wrangler-secrets.json
